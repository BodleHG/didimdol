apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-farm
  namespace: abs
data:
  SIM_MODE: VIRTUAL_TIME
  TYPE: smart_farm
  TOTAL_DAY: '3'
  TARGET_PRODUCTION: '50'
  FAILURE_RATE: '0.1'
  GROWTH_DAYS_REQUIRED: '0.8'
  SOIL_RANGE: "(40, 60)"
  HUMIDITY_RANGE: "(50, 70)"
  TEMP_RANGE: "(18, 26)"
  ADJUST_INTERVAL: '1'

---

apiVersion: v1
kind: Pod
metadata:
  name: smart-farm-simulator
  namespace: abs
spec:
  containers:
    - name: simulator
      image: bodlehg/didimdol:smart_farm
      imagePullPolicy: Always
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      envFrom:
      - configMapRef:
          name: smart-farm
      resources:
        requests:
          memory: "2Gi"
          cpu: 2
        limits:
          memory: "4Gi"
          cpu: 4
  restartPolicy: Never
